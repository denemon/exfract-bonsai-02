<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程18比較</title><style>body{margin:0;padding:24px;background:#141c22;color:#e4e7e2;font:14px/1.7 system-ui}h1{font-size:20px;font-weight:500}button{background:#253239;color:inherit;border:1px solid #647378;padding:8px 16px;margin:4px;cursor:pointer}figure{margin:0;position:relative;max-width:1100px;aspect-ratio:1.6;background:#101820;overflow:hidden}figure img{position:absolute;width:100%;height:100%;object-fit:contain}#after{clip-path:inset(0 50% 0 0)}input{display:block;width:min(1100px,100%);margin:16px 0}p{max-width:1000px}a{color:#bfd2c8}</style><h1>工程18 — 背景の局所改善候補、完成認定なし</h1><p>左が候補、右が工程17。スライダーで比較。参照画像と過去写真はread-onlyリンクし、サイトの背景には使用しない。</p><nav><button data-kind="garden">同条件庭全景</button><button data-kind="bonsai">同条件盆栽</button><button data-kind="wood">同条件幹寄り</button><button data-kind="pc">通常PC</button><button data-kind="390">390px</button><button data-kind="320">320px</button></nav><p id="note"></p><figure id="frame"><img id="before" alt="工程17"><img id="after" alt="工程18"></figure><input type="range" min="0" max="100" value="50" aria-label="比較幅"><p>遠冠の暗い内部、裸軸、苔mat、柱/軒の競合、主役の古木造形は未達。実ブラウザ/機能テスト成功を美的完成としない。<a href="RESULT.md">結果</a> / <a href="qa/background-review.md">独立レビュー</a> / <a href="NEXT-STAGE.md">次工程</a></p><p>読み取り専用の外観目標:</p><img style="max-width:700px;width:100%" src="../hybrid-1132/images/desktop-candidate01.png" alt="以前の外観目標"><script>const pairs={"garden": {"before": "../carved-mass-1340/qa/final-browser-verified/after-garden.jpg", "after": "qa/final-scene/after-garden.jpg", "note": "同じ実camera/FOV/exposure、主役key/material固定。背景形状/背景素材/room lightは変更。"}, "bonsai": {"before": "../carved-mass-1340/qa/final-browser-verified/after-bonsai.jpg", "after": "qa/final-scene/after-bonsai.jpg", "note": "同じ実camera/FOV/exposure、主役key/material固定。背景形状/背景素材/room lightは変更。"}, "wood": {"before": "qa/wood-settled-comparison/before-wood.jpg", "after": "qa/wood-settled-comparison/after-wood.jpg", "note": "詳細葉を読み込み完了後に同highLOD/actual cameraへ固定した追加比較。主役実geometrySHAも一致。通常LOD/GPU性能の条件とは区別。"}, "390": {"before": "../carved-mass-1340/qa/final-browser-verified/mobile-390.jpg", "after": "qa/final-scene/mobile-390.jpg", "note": "native構図の比較。yawと縦位置を変更したので構図差を含む。"}, "320": {"before": "../carved-mass-1340/qa/final-browser-verified/mobile-320.jpg", "after": "qa/final-scene/mobile-320.jpg", "note": "native構図の比較。yawと縦位置を変更したので構図差を含む。"}, "pc": {"before": "../carved-mass-1340/qa/final-browser-verified/pc.jpg", "after": "qa/final-scene/pc.jpg", "note": "通常PC。候補d3.65m、従来3.95mで構図差を含む。"}};const before=document.querySelector('#before'),after=document.querySelector('#after'),frame=document.querySelector('#frame');function show(k){const p=pairs[k];before.src=p.before;after.src=p.after;document.querySelector('#note').textContent=p.note;frame.style.aspectRatio=k==='390'?'390/844':k==='320'?'320/568':'1.6';frame.style.maxWidth=['390','320'].includes(k)?'460px':'1100px'}document.querySelector('input').oninput=e=>after.style.clipPath='inset(0 '+(100-e.target.value)+'% 0 0)';for(const b of document.querySelectorAll('button'))b.onclick=()=>show(b.dataset.kind);show('garden');</script></html>

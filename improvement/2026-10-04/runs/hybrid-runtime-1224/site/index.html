<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#102033" />
    <title>庭</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main aria-label="夜の静かな庭に置かれた盆栽">
      <picture>
        <source media="(max-aspect-ratio: 2/5)" srcset="/tall.webp" />
        <source media="(max-aspect-ratio: 4/5)" srcset="/portrait.webp" />
        <source media="(max-aspect-ratio: 137/100)" srcset="/square.webp" />
        <source media="(min-aspect-ratio: 17/10)" srcset="/wide.webp" />
        <img id="scene-image" src="/desktop.webp" fetchpriority="high" decoding="sync"
          alt="灰褐色のねじれた老木と非対称の深緑の枝葉を持つ盆栽。浅い茶褐色の鉢が低い自然石に置かれ、苔と砂利、木造の旅館が静かな夜の光を受ける。" />
      </picture>
      <canvas aria-hidden="true"></canvas>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

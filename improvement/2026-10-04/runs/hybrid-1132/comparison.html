<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>完成景の比較</title><style>body{margin:24px;background:#e8e5dc;color:#292d28;font:15px/1.7 system-ui}main{max-width:1480px;margin:auto}h1{font-size:23px;font-weight:500}nav{display:flex;gap:18px;align-items:center;margin:16px 0}select{font:inherit;padding:7px 12px}.stage{position:relative;max-width:100%;margin:auto}.stage img{display:block;width:100%}.after{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}.line{position:absolute;inset:0 auto 0 50%;border-left:2px solid #fff}input{width:min(700px,100%);display:block;margin:16px auto}.labels{display:flex;justify-content:space-between}a{color:#31583e;margin-right:18px}.note{max-width:1000px}</style><main><h1>画像主体の完成景候補</h1><p class="note">11:32承認の限定視点ハイブリッド方式。まず静止画として比較し、PC・390px・320pxの構図を選定。限定視差・局所動きは次の工程です。</p><nav><label>画角 <select id="v"><option value="desktop">PC 1440×900</option><option value="mobile-390">390×844</option><option value="mobile-320">320×932</option></select></label><label>比較元 <select id="old"><option value="0900-jst/final">09時版</option><option value="hero-rebuild-1016/final">未採用の実3D試作</option></select></label></nav><div class="labels"><span>左：新しい完成景</span><span>右：比較元</span></div><div class="stage"><img id="before" alt="比較元の全景"><img id="after" class="after" alt="新しい完成景"><div class="line"></div></div><input id="range" type="range" min="0" max="100" value="50" aria-label="比較位置"><p><a id="image" target="_blank">新しい全景を原寸で開く</a><a href="IMAGE_REVIEW.md">評価・保存・未検証</a></p></main><script>const $=x=>document.getElementById(x);function show(){const v=$('v').value;$('before').src='../'+$('old').value+'/'+v+'.png';$('after').src='browser/'+v+'.png';$('image').href='browser/'+v+'.png';document.querySelector('.stage').style.width=(v==='desktop'?1440:v==='mobile-390'?390:320)+'px';}['v','old'].forEach(x=>$(x).addEventListener('change',show));$('range').addEventListener('input',()=>{const n=$('range').value;$('after').style.clipPath='inset(0 '+(100-n)+'% 0 0)';document.querySelector('.line').style.left=n+'%';});show();</script></html>

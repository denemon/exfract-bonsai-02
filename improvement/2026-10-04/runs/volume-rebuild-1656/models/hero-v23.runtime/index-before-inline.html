<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#17263b">
    <title>庭</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <main aria-label="夜の静かな庭に置かれた盆栽">
      <picture>
        <source media="(max-aspect-ratio:2/5)" srcset="/still-tall.webp">
        <source media="(orientation:portrait) and (max-width:340px)" srcset="/still-320.webp">
        <source media="(orientation:portrait)" srcset="/still-portrait.webp">
        <source media="(min-aspect-ratio:2/1)" srcset="/still-wide.webp">
        <source media="(max-aspect-ratio:4/3)" srcset="/still-square.webp">
        <img src="/still-desktop.webp" alt="古木の盆栽と静かな庭" fetchpriority="high">
      </picture>
      <canvas id="scene" aria-hidden="true"></canvas>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

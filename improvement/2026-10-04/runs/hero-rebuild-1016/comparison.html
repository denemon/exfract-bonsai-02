<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>盆栽 構造試作の比較</title><style>body{margin:24px;background:#ece9e1;color:#292b26;font:15px/1.7 system-ui,sans-serif}main{max-width:1480px;margin:auto}h1{font-size:24px;font-weight:500}nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:20px 0}select,button{font:inherit;padding:7px 12px}a{color:#315744}.stage{position:relative;max-width:100%;margin:20px auto;background:#ddd9d1}.stage img{display:block;width:100%}.after{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}.line{position:absolute;top:0;bottom:0;left:50%;border-left:2px solid white;pointer-events:none}input[type=range]{width:min(100%,700px);display:block;margin:12px auto}.labels{display:flex;justify-content:space-between;gap:20px}.note{max-width:900px}.links a{margin-right:20px}small{color:#5a5b54}</style><main><h1>構造試作06 — 未採用</h1><p class="note">根元の厚みと分岐は改善した一方、老木として自然な幹・生き筋のつながりと、PC/390/320の全景品質は採用基準未達と判断。09時版を保持。これは比較資料で、実サイトには文字を表示しません。</p><nav><label>画角 <select id="view"><option value="desktop">PC 1440×900</option><option value="mobile-390">390×844</option><option value="mobile-320">320×932</option></select></label><label><input type="checkbox" id="clay"> 同一カメラ・同一白色照明の単色</label><label><input type="checkbox" id="control" checked> 09時と同一カメラ</label></nav><div class="labels"><span>左側：構造試作06</span><span>右側：09時採用版</span></div><div class="stage"><img id="before" alt="09時採用版の全景"><img id="after" class="after" alt="未採用の構造試作06の全景"><div class="line"></div></div><input type="range" min="0" max="100" value="50" aria-label="比較境界" id="range"><p class="links"><a id="oldlink" target="_blank">09時版を単体の原寸で開く</a><a id="newlink" target="_blank">試作を単体の原寸で開く</a><a href="REPORT.md">判定と検証記録</a></p><p class="note"><small>単色では背景・テクスチャ・頂点色・AOを外し、同一の白色照明を使用。全景は夜の光と背景の変更を含みます。390px/320pxは各画像をCSSの原寸幅で表示します。PCはウィンドウ幅に合わせて縮小される場合があるため、単体リンクでも確認してください。</small></p></main><script>const $=id=>document.getElementById(id);function update(){const v=$('view').value,clay=$('clay').checked,control=$('control').checked;const old=(clay?'control-clay-neutral/':'../0900-jst/final/')+v+'.png',fresh=(clay?'candidate-clay-neutral/':control?'same-camera/':'final/')+v+'.png';$('before').src=old;$('after').src=fresh;$('oldlink').href=old;$('newlink').href=fresh;document.querySelector('.stage').style.width=(v==='desktop'?1440:v==='mobile-390'?390:320)+'px';$('control').disabled=clay;}['view','clay','control'].forEach(id=>$(id).addEventListener('change',update));$('range').addEventListener('input',()=>{const v=$('range').value;$('after').style.clipPath='inset(0 '+(100-v)+'% 0 0)';document.querySelector('.line').style.left=v+'%';});update();</script></html>

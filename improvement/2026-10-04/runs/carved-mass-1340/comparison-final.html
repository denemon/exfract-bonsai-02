<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>背景比較記録</title><style>body{margin:0;padding:24px;font:14px/1.7 system-ui;background:#141c22;color:#e2e5e2}h1{font-size:20px;font-weight:500}button{background:#253239;color:inherit;border:1px solid #647378;padding:8px 16px;margin:4px;cursor:pointer}figure{margin:0;position:relative;max-width:1100px;aspect-ratio:1.6;background:#101820;overflow:hidden}figure img{position:absolute;width:100%;height:100%;object-fit:contain}#after{clip-path:inset(0 50% 0 0)}input{display:block;width:min(1100px,100%);margin:16px 0}a{color:#b9d4cc}#goal{position:static;width:min(700px,100%);height:auto}p{max-width:1000px}.mobile{max-width:460px;aspect-ratio:390/844}</style><h1>背景の相対改善候補 — 本採用・完成認定なし</h1><p>左が候補、右が従来。スライダーで比較。PC3鑑賞距離は同じ実camera・露出・主役key。背景配置、室内光、背景材質と空色は変更。スマホは構図も変更した。</p><nav><button data-kind="garden">庭全景</button><button data-kind="bonsai">盆栽全体</button><button data-kind="wood">幹寄り</button><button data-kind="390">390px</button><button data-kind="320">320px</button></nav><figure id="frame"><img id="before" src="qa/background-structure/before-garden.jpg" alt="従来"><img id="after" src="qa/final-browser-verified/after-garden.jpg" alt="候補"></figure><input type="range" min="0" max="100" value="50" aria-label="比較幅"><p>遠冠の反復、滑らかな苔、古木の形状、柱との競合、砂利の余白は未達。機能テスト成功で美的完成を認定しない。<a href="RESULT.md">実装・検証結果</a> / <a href="qa/background-review.md">独立レビュー</a> / <a href="candidate/README.md">ローカル起動</a></p><p>目標画像は外観比較用。サイト・fallbackへ取り込んでいない。</p><img id="goal" src="../hybrid-1132/images/desktop-candidate01.png" alt="外観目標"><script>const before=document.querySelector('#before'),after=document.querySelector('#after'),frame=document.querySelector('#frame');document.querySelector('input').oninput=e=>after.style.clipPath='inset(0 '+(100-e.target.value)+'% 0 0)';for(const b of document.querySelectorAll('button'))b.onclick=()=>{const k=b.dataset.kind,m=['390','320'].includes(k);frame.classList.toggle('mobile',m);frame.style.aspectRatio=m?(k==='390'?'390/844':'320/568'):'1.6';before.src=m?'qa/current-production/mobile-'+k+'.jpg':'qa/background-structure/before-'+k+'.jpg';after.src=m?'qa/final-browser-verified/mobile-'+k+'.jpg':'qa/final-browser-verified/after-'+k+'.jpg';};</script></html>

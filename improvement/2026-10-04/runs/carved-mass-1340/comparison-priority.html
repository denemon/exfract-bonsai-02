<!doctype html><html lang="ja"><meta charset="utf-8"><title>工程17 優先領域比較</title><style>body{background:#181b1a;color:#e7e5df;font:16px system-ui;margin:24px}section{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}img{width:100%;height:auto}figure{margin:0}figcaption{margin:12px 0}aside{display:flex;gap:24px}aside img{max-width:390px}p{max-width:1000px;line-height:1.7}</style><h1>背景を先に再構成する</h1><p>生成参考は目標の外観。右は現在5208の実3D。盆栽を固定し、軒・室内・瓦屋根・遠景植栽・苔丘と石の距離を先に改修する。完成保証はしない。</p><section><figure><img src="../hybrid-1132/images/desktop-candidate01.png"><figcaption>選定生成PC参考、1586×992</figcaption></figure><figure><img src="qa/current-production/pc.jpg"><figcaption>現在5208、PC1440×900、Chrome実表示</figcaption></figure></section><aside><figure><img src="qa/current-production/mobile-390.jpg"><figcaption>390×844</figcaption></figure><figure><img src="qa/current-production/mobile-320.jpg"><figcaption>320×568</figcaption></figure></aside><p>現在景の差：広い一様な空と砂利、右端へ切れた開口、低い板壁一枚と疎な遠景、薄い苔と離れた石。木も古木造形未達。近い数時間で検証できる建築・地面・背景植栽から全景を改善する。</p></html>

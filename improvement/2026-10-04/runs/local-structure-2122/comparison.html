ild-1656/qa/final-comparison/clay-right.png" alt="保存中のv23 — 形状ゲート未達 右25°"></a><figcaption>保存中のv23 — 形状ゲート未達</figcaption></figure><figure><a href="qa/a/right.png"><img src="qa/a/right.png" alt="局所案A — 不採用 右25°"></a><figcaption>局所案A — 不採用</figcaption></figure><figure><a href="qa/b/right.png"><img src="qa/b/right.png" alt="局所案B — 不採用 右25°"></a><figcaption>局所案B — 不採用</figcaption></figure></div><h2>現在保持するv23の全景 — 前工程の撮影</h2><p>以下は変更していない前工程のPC・390px・320px画像。本工程で再検証したものではありません。</p><div class="row"><figure><a href="../volume-rebuild-1656/qa/final-production/pc.png"><img src="../volume-rebuild-1656/qa/final-production/pc.png" alt="v23 PC 1440×900"></a><figcaption>v23 — PC 1440×900</figcaption></figure><figure><a href="../volume-rebuild-1656/qa/final-production/mobile-390.png"><img src="../volume-rebuild-1656/qa/final-production/mobile-390.png" alt="v23 390×844"></a><figcaption>v23 — 390×844</figcaption></figure><figure><a href="../volume-rebuild-1656/qa/final-production/mobile-320.png"><img src="../volume-rebuild-1656/qa/final-production/mobile-320.png" alt="v23 320×568"></a><figcaption>v23 — 320×568</figcaption></figure></div><p><a href="REPORT.md">工程報告</a> · <a href="validation.json">検証記録</a></p></main></html>
